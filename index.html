<div class=meta>${meta([typ(p.type),hood(p.neighborhood),g=='Other'||g.startsWith('Miami')?city(p.city):''])}${pl?'<i>·</i>'+e(pl):'<i>·</i><span class=unk>Unknown</span>'}</div></div><div class=side>${p.url&&p.closed!='yes'?(isWeb(p)?`<a class="book web" href="${e(p.url)}" target=_blank rel=noopener>Website</a>`:`<a class=book href="${e(p.url)}" target=_blank rel=noopener>Book</a>`):''}<button class=x data-l=want data-n="${e(p.name)}" data-c="${e(p.city)}" aria-label="Remove ${e(p.name)}" title="Remove ${e(p.name)}">✕</button></div></div>`}).join('')}
$('b2').innerHTML=h||'<p class=empty>No matches.</p>'}
['c1','q1'].forEach(i=>$(i).oninput=r1);['c2','p2','q2'].forEach(i=>$(i).oninput=r2);
let tab='been';const sw=t=>{tab=t;$('t1').classList.toggle('on',t=='been');$('t2').classList.toggle('on',t=='want');$('s1').classList.toggle('hidden',t!='been');$('s2').classList.toggle('hidden',t=='been');scrollTo(0,0)};
$('t1').onclick=()=>sw('been');$('t2').onclick=()=>sw('want');
/* ---- add sheet ---- */
const fm=$('fm');$('fab').onclick=()=>{fm.reset();const b=tab=='been';$('fh').textContent=b?'Add to Been There':'Add to Want to Try';$('bf').style.display=b?'':'none';fm.rating.required=b;$('ov').classList.add('on');setTimeout(()=>fm.name.focus(),50)};
const close=()=>$('ov').classList.remove('on');$('cx').onclick=close;$('ov').onclick=ev=>{if(ev.target.id=='ov')close()};
fm.onsubmit=ev=>{ev.preventDefault();const f=new FormData(fm),n=f.get('name').trim(),c=f.get('city').trim(),t=f.get('type').trim();
 if(tab=='been'){const r=parseFloat(f.get('rating'));if(!(r>=1&&r<=10))return alert('Rating must be 1–10');edit({action:'add',list:'been',name:n,city:c,type:t,rating:r,date:f.get('date')||new Date().toISOString().slice(0,10)})}
 else edit({action:'add',list:'want',name:n,city:c,type:t});close()};
document.addEventListener('click',ev=>{const b=ev.target.closest('.x');if(b)del(b.dataset.l,b.dataset.n,b.dataset.c)});
r1();r2();
</script></body></html>
